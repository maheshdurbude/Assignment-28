<!DOCTYPE html>
<html lang="en">
<head>

    <title>Tic tac game</title>

    <style>
       body {
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea, #764ba2);
            font-family: Arial, sans-serif;
        }
        .box {
            height: 100px;
            width: 100px;
            border: 1px solid black;
            margin: 1px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .tic-tac-toe {
            display: flex;
            flex-wrap: wrap;
            width: 400px;
            margin: 2px auto;
            justify-content: center;
            align-items: center;
        }

        .app-title {
            text-align: center;
        }

        .tile-icon {
            height: 70px;
        }
         button {
                 display: block;
              margin: 20px auto;
              border: none;
              outline: none;
              padding: 12px 30px;
              font-size: 16px;
              font-weight: bold;
              color: white;
              background: linear-gradient(135deg, #667eea, #764ba2);
              border-radius: 10px;
              cursor: pointer;
              transition: all 0.2s ease;
             }

           button:hover {
                transform: translateY(-2px);
                box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
           }

           button:active {
               transform: scale(0.97);
                }

    @media (max-width: 500px) {
        .game-container {
            width: 90%;
            padding: 25px 15px;
        }

        .app-title {
            font-size: 28px;
        }
       
       
    </style>

</head>

<body>
    <h1 class="app-title">Tic Tac Game</h1>
    <p id="text-current-player"> player x turn</p>
    <div class="tic-tac-toe" id="board"></div>
    <button type="button" onclick="resetGame()">
        Reset Game
    </button>

    <script>

        let currentPlayer = 1;
        const boardElement = document.getElementById("board");
        const currentPlayerText =
            document.getElementById("text-current-player");
        const board = [ -1, -1, -1,-1, -1, -1, -1, -1, -1 ];


        function renderBoard() {
            boardElement.innerHTML = "";
            for (let i = 0; i < board.length; i++) {
                const imgName =
                    board[i] == 0
                        ? "circle.png"
                        : board[i] == 1
                            ? "cross.png"
                            : "";

                boardElement.innerHTML += `
                    <div class="box"
                         id="box-${i}"
                         onClick="boxClicked(${i})">

                        <img src="${imgName}" class="tile-icon"/>

                    </div>
                `;
            }
            currentPlayerText.innerText =
                `current Player: ${currentPlayer == 1 ? "x" : "0"}`;
            checkWinner();
        }
        renderBoard();
        function boxClicked(index) {

            if (board[index] != -1) {

                alert("Box already occupied!");
                return;
            }
            console.log("Box clicked: " + index);

            board[index] = currentPlayer;

            currentPlayer = currentPlayer == 1 ? 0 : 1;

            console.log("next player: " + currentPlayer);

            renderBoard();
        }
        function checkWinner() {

            let winner = -1;
            if (board[0] == 1 && board[1] == 1 && board[2] == 1) {
               winner = 1;
            } else if (board[0] == 0 && board[1] == 0 && board[2] == 0) {
                winner = 0;
            } else if (board[3] == 1 &&  board[4] == 1 && board[5] == 1) {
                winner = 1;
            } else if (board[3] == 0 &&  board[4] == 0 &&  board[5] == 0) {
                winner = 0;
            } else if (board[6] == 1 &&  board[7] == 1 &&  board[8] == 1) {
                winner = 1;
            } else if (board[6] == 0 &&  board[7] == 0 &&  board[8] == 0) {
                winner = 0;
            } else if (board[0] == 1 &&  board[3] == 1 &&  board[6] == 1) {
             winner = 1;
            } else if (board[0] == 0 &&  board[3] == 0 &&  board[6] == 0) {
           winner = 0;
            } else if (board[1] == 1 &&   board[4] == 1 &&   board[7] == 1) {
                winner = 1;
            } else if (board[1] == 0 && board[4] == 0 && board[7] == 0) {
                winner = 0;
            } else if (board[2] == 1 &&  board[5] == 1 && board[8] == 1) {
                winner = 1;
            } else if (board[2] == 0 &&  board[5] == 0 &&  board[8] == 0) {
               winner = 0;
            } else if (board[0] == 1 &&   board[4] == 1 && board[8] == 1) {
             winner = 1;
            } else if (board[0] == 0 &&  board[4] == 0 &&   board[8] == 0) {
                winner = 0;
            } else if (board[2] == 1 &&   board[4] == 1 &&   board[6] == 1) {
                winner = 1;
            } else if (board[2] == 0 &&  board[4] == 0 &&  board[6] == 0) {
                winner = 0;
            }
            if (winner == -1) {
                return;
            }
            alert(
                winner == 1
                    ? "player x wins"
                    : winner == 0
                        ? "player 0 wins!"
                        : ""
            );

        }
        function resetGame() {

            for (let i = 0; i < board.length; i++) {

                board[i] = -1;
            }
            currentPlayer = 1;
            renderBoard();
        }

    </script>

</body>
</html>
