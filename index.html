<!DOCTYPE html>
<html lang="en">
<head>
   
    <title>Tic tac game</title>
    <style>
     .box {
        height: 100px;
        width: 100px;
        border: 1px solid black; 
        margin: 1px;
     }
     .tic-tac-toe {
        display: flex;
        flex-wrap: wrap;
        width: 400px;
        margin: 2px auto;
     }
    </style>
</head>
<body>
    <h1>tic tac game </h1>
    <div class="tic-tac-toe">
      <div class="box"></div>
        <div class="box"></div>
          <div class="box"></div>
            <div class="box"></div>
              <div class="box"></div>
                <div class="box"></div>
                  <div class="box"></div>
                    <div class="box"></div>
                      <div class="box"></div>
    </div>                  
</body>
</html>
