<!DOCTYPE html>
<html lang="en">
<head>
   
    <title>Tic tac game</title>
    <style>
     .box {
        height: 100px;
        width: 100px;
        border: 1px solid black; 
        margin: 1px;
     }
     .tic-tac-toe {
        display: flex;
        flex-wrap: wrap;
        width: 400px;
        margin: 2px auto;
     }
     .app-title {
        text-align: center;
     }
    </style>
</head>
<body>
    <h1 class="app-title ">tic tac game </h1>

    <p id="text-current-player">Current player: x</p>
    <div class="tic-tac-toe" id="board"></div> 

    <script>
         let currentPlayer = 0;
         const boardElement = document.getElementById("board");

         const board = [-1, -1, -1, -1, -1, -1, -1, -1, -1,];

         boardElement.innerHTML = "";

         for (let i=0; i< board.length; i++){

            boardElement.innerHTML += `<div class="box" id="box-${i}"></div>`;
         }
    </script>                
</body>
</html>
